<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Smart Interview System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    {% include "navbar.html" %}


    <main class="container">


        <section class="card">

            <div class="dashboard-header">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue your AI-powered
                    interview preparation.
                </p>

            </div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="login-btn"
                >
                    Login
                </button>


                <p
                    id="login-message"
                    class="message"
                ></p>


            </form>


            <div class="dashboard-info">

                <p>
                    Don't have an account?
                    <a href="/register">
                        Create an account
                    </a>
                </p>

            </div>


        </section>


    </main>


    <script
        src="{{ url_for('static', filename='js/login.js') }}"
    ></script>


</body>

</html>
