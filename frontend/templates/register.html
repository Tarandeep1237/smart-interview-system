<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Smart Interview System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    {% include "navbar.html" %}


    <main class="container">


        <section class="card">


            <div class="dashboard-header">

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Register to start your personalized
                    AI-powered interview preparation.
                </p>

            </div>


            <form id="registerForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="register-btn"
                >
                    Create Account
                </button>


                <p
                    id="register-message"
                    class="message"
                ></p>


            </form>


            <div class="dashboard-info">

                <p>
                    Already have an account?
                    <a href="/login">
                        Login here
                    </a>
                </p>

            </div>


        </section>


    </main>


    <script
        src="{{ url_for('static', filename='js/register.js') }}"
    ></script>


</body>

</html>
